name: Desplegar sitio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - ".github/workflows/desplegar.yml"

# Este workflow no escribe en el repositorio: compila y despliega con el
# token de Cloudflare, que va aparte. Sin permiso de escritura, aunque una
# dependencia comprometida se ejecutara aquí, no podría tocar el código.
permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Astro 6 en adelante exige Node 22 o superior. El runner ya usa 24
      # por defecto, así que lo pedimos explícitamente y evitamos el aviso.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # `npm ci` en vez de `npm install`: instala EXACTAMENTE lo que dice
      # package-lock.json, y falla si el lockfile no existe o no cuadra
      # con package.json. Es lo que hace el despliegue reproducible.
      # REQUIERE que sitio/package-lock.json exista: correr antes el
      # workflow "Generar lockfiles" una vez.
      - name: Instalar dependencias
        run: cd sitio && npm ci

      # El mapa se regenera aquí, contra el arbol que se está desplegando,
      # y ANTES de compilar para que Astro copie sitio/public/ ya al día.
      #
      # POR QUÉ HACE FALTA. La copia del mapa que sirve el sitio la
      # mantenía solo el workflow "Actualizar mapa", que confirma con
      # GITHUB_TOKEN — y GitHub no encadena workflows a partir de commits
      # hechos con ese token. Es decir: el bot arreglaba sitio/public/
      # mapa.txt en el repositorio y ese arreglo no disparaba ningún
      # despliegue. Cloudflare siguió sirviendo lo primero que se subió a
      # esa ruta, indefinidamente. No un despliegue por detrás: congelada.
      #
      # Y era invisible, porque mapa.py excluye sitio/public/mapa.txt de su
      # propio índice (indexarla haría que su huella dependiera de sí
      # misma). El único archivo que nadie verifica era justo el designado
      # como copia de referencia.
      #
      # Regenerarlo aquí lo ata al despliegue en vez de al commit del bot.
      # No hace falta permiso de escritura: se escribe en el checkout
      # efímero del runner, no en el repositorio. MAPA.md lo sigue
      # manteniendo el workflow "Actualizar mapa"; aquí solo se escribe
      # de paso y se descarta con el runner.
      #
      # Queda un desfase residual conocido: este workflow solo se dispara
      # con cambios en sitio/**, así que un cambio en pipeline/ o en data/
      # actualiza MAPA.md pero no la copia servida hasta el siguiente
      # despliegue. Se detecta comparando las dos huellas de repositorio,
      # que es para lo que están.
      #
      # mapa.py solo usa la biblioteca estándar: no instala requirements.
      - name: Regenerar el mapa antes de compilar
        run: cd pipeline && python mapa.py

      - name: Compilar
        run: cd sitio && npm run build

      - name: Desplegar a Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sitio
          # Sin esta línea la acción instala wrangler 3, que no sabe desplegar
          # un sitio de solo activos estáticos y falla con "Missing entry-point".
          wranglerVersion: "4"
