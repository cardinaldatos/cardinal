name: Desplegar sitio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - ".github/workflows/desplegar.yml"

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Astro 6 en adelante exige Node 22 o superior.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: cd sitio && npm install

      - name: Compilar
        run: cd sitio && npm run build

      - name: Desplegar a Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sitio
