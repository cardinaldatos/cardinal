name: Desplegar sitio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - ".github/workflows/desplegar.yml"

# Este workflow no escribe en el repositorio: compila y despliega con el
# token de Cloudflare, que va aparte. Sin permiso de escritura, aunque una
# dependencia comprometida se ejecutara aquí, no podría tocar el código.
permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Astro 6 en adelante exige Node 22 o superior. El runner ya usa 24
      # por defecto, así que lo pedimos explícitamente y evitamos el aviso.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `npm ci` en vez de `npm install`: instala EXACTAMENTE lo que dice
      # package-lock.json, y falla si el lockfile no existe o no cuadra
      # con package.json. Es lo que hace el despliegue reproducible.
      # REQUIERE que sitio/package-lock.json exista: correr antes el
      # workflow "Generar lockfiles" una vez.
      - name: Instalar dependencias
        run: cd sitio && npm ci

      - name: Compilar
        run: cd sitio && npm run build

      - name: Desplegar a Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sitio
          # Sin esta línea la acción instala wrangler 3, que no sabe desplegar
          # un sitio de solo activos estáticos y falla con "Missing entry-point".
          wranglerVersion: "4"
