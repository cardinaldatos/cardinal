name: Explorar RPW

on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Construir la pieza de remesas
        run: cd pipeline && python remesas.py

      - name: Guardar los JSON para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remesas-costo-latam
          path: data/remesas-costo-latam/
          if-no-files-found: warn
