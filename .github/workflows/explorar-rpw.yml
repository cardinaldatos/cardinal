name: Explorar RPW

# Solo cuando le das al botón. No corre solo.
on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Descubrir las fuentes RPW
        run: cd pipeline && python explorar_rpw.py

      - name: Guardar los JSON para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpw-descubrimiento
          path: data/rpw-descubrimiento/
          if-no-files-found: warn
