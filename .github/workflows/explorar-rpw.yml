name: Explorar RPW

# Solo se ejecuta cuando le das al boton. No corre solo.
on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr el descubrimiento
        run: python pipeline/explorar_rpw.py

      - name: Guardar los JSON crudos para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpw-descubrimiento
          path: crudo/rpw_descubrimiento/
          if-no-files-found: warn
