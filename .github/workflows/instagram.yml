name: Generar Instagram

on:
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        run: cd instagram && npm install

      - name: Instalar navegador de Playwright
        run: cd instagram && npx playwright install --with-deps chromium

      - name: Generar imágenes
        run: cd instagram && node generar.mjs

      - name: Guardar imágenes para descargar
        uses: actions/upload-artifact@v4
        with:
          name: instagram-feed
          path: instagram/salida/
          if-no-files-found: error
