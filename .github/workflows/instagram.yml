name: Generar Instagram

on:
  workflow_dispatch:

# Solo lee el repo y sube un artifact; no necesita escribir.
permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # `npm ci` instala exactamente lo fijado en package-lock.json.
      # REQUIERE que instagram/package-lock.json exista: correr antes el
      # workflow "Generar lockfiles" una vez.
      - name: Instalar dependencias
        run: cd instagram && npm ci

      - name: Instalar navegador de Playwright
        run: cd instagram && npx playwright install --with-deps chromium

      - name: Generar presentación
        run: cd instagram && node generar-presentacion.mjs

      - name: Generar anuncio de dominio
        run: cd instagram && node generar-dominio.mjs

      - name: Generar feed
        run: cd instagram && node generar.mjs

      - name: Generar carrusel
        run: cd instagram && node generar-carrusel.mjs

      - name: Guardar imágenes para descargar
        uses: actions/upload-artifact@v4
        with:
          name: instagram-imagenes
          path: instagram/salida/
          if-no-files-found: error
