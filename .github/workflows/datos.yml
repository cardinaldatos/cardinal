name: Verificar fuentes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Comprobar las tres APIs
        run: cd pipeline && python verificar.py
