# Dependabot: vigila las dependencias y propone las actualizaciones por
# pull request, que se revisan y fusionan desde la web de GitHub.
#
# Cubre cuatro frentes: los dos npm (sitio e instagram), el pip del
# pipeline y las propias GitHub Actions de los workflows.
#
# CÓMO LLEGAN LAS ACTUALIZACIONES. Las menores y de parche vienen
# agrupadas en un solo PR semanal por frente. Las mayores vienen
# sueltas, una por una, y eso es deliberado: son las que hay que leer
# antes de mezclar. No hace falta declarar un grupo para las mayores —
# al contrario, agruparlas las juntaría todas en un PR y las volvería
# imposibles de mezclar por separado. Basta con que el grupo de menores
# exista: todo lo que no entra en él sale individual.
#
# POR QUÉ EL LÍMITE. Sin él Dependabot admite hasta cinco PR abiertos
# por frente, veinte en total, y se acumulan sin que nadie lo note.
# Con el límite puesto deja de abrir nuevos hasta que se mezclen los que
# hay: el atasco se ve antes de ser un atasco. El límite rige las
# actualizaciones de versión; las de seguridad se cuentan aparte, que es
# lo correcto — un aviso de vulnerabilidad no debe quedarse en cola
# porque haya PR rutinarios sin revisar.
#
# Ojo: fusionar un PR que toque sitio/** dispara el despliegue, y
# también lo dispara uno que modifique desplegar.yml — que es lo que
# pasa cuando se actualiza una acción usada ahí. Es lo esperado: la
# actualización queda probada en producción de inmediato.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/sitio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      menores:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/instagram"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      menores:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      menores:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      menores:
        applies-to: version-updates
        update-types: ["minor", "patch"]
