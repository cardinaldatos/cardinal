# Dependabot: vigila las dependencias y propone las actualizaciones por
# pull request, que se revisan y fusionan desde la web de GitHub.
#
# Cubre cuatro frentes: los dos npm (sitio e instagram), el pip del
# pipeline y las propias GitHub Actions de los workflows. Las
# actualizaciones menores y de parche llegan agrupadas en un solo PR
# semanal por frente, para no inundar de avisos a una sola mantenedora.
# Las mayores llegan sueltas, que es lo que queremos: cada una se lee
# aparte. Eso ya lo hace el grupo de menores por sí solo — agrupar las
# mayores las juntaría todas en un PR y las volvería inseparables.
#
# El límite de PR abiertos es lo único nuevo. Sin él Dependabot admite
# hasta cinco por frente, veinte en total, y se acumulan sin que nadie
# lo note. Con el límite puesto, deja de abrir nuevos hasta que se
# mezclen los que hay: el atasco se ve antes de ser un atasco.
#
# Ojo: fusionar un PR que toque sitio/** dispara el despliegue. Es lo
# esperado: la actualización queda probada en producción de inmediato.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/sitio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      menores:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/instagram"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      menores:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
